services:
  - type: web
    name: enp162-render-experiment
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DEVICE_TOKEN
        sync: false
      - key: DASHBOARD_TOKEN
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
